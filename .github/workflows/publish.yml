name: Publish to PyPI (dcd-storage-client)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build and twine check only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Build, Validate & Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Install build & upload tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution files
        run: twine check dist/*

      - name: Publish to PyPI
        if: ${{ inputs.dry_run != true }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/* --non-interactive --skip-existing
